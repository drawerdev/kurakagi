plugins {
    id 'com.android.application'
}

// Release signing. The keystore and its passwords never live in this repository: they are read
// from ~/.gradle/gradle.properties or environment variables.
//   KURAKAGI_KEYSTORE           path to the keystore (e.g. C:\Users\<user>\keys\kurakagi.keystore)
//   KURAKAGI_KEYSTORE_PASSWORD  keystore password
//   KURAKAGI_KEY_ALIAS          key alias
//   KURAKAGI_KEY_PASSWORD       key password
// When any of them is missing (or the file does not exist), assembleRelease still succeeds and
// produces an unsigned APK.
def kurakagiSigningValue = { String name ->
    def v = project.findProperty(name)
    if (v == null) {
        v = System.getenv(name)
    }
    return (v != null && v.toString().trim().length() > 0) ? v.toString().trim() : null
}
def releaseKeystorePath = kurakagiSigningValue('KURAKAGI_KEYSTORE')
def releaseKeystorePassword = kurakagiSigningValue('KURAKAGI_KEYSTORE_PASSWORD')
def releaseKeyAlias = kurakagiSigningValue('KURAKAGI_KEY_ALIAS')
def releaseKeyPassword = kurakagiSigningValue('KURAKAGI_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath != null && releaseKeystorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null && file(releaseKeystorePath).isFile()

android {
    namespace = 'io.github.drawerdev.kurakagi'
    compileSdk = 34

    defaultConfig {
        applicationId = "io.github.drawerdev.kurakagi"
        minSdk = 7
        targetSdk = 34
        versionCode = 3
        versionName = "1.1.0"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
        if (hasReleaseSigning) {
            release {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                // v1 (JAR) signing is required below Android 7.0; minSdk is 7.
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        debug {
            // Installs next to the release build, so testing never replaces a signed install
            // (and the accounts stored in it).
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            // Same as the 1.0.x builds: no shrinking, ZXing is dexed as is.
            minifyEnabled = false
            // Never fall back to the debug key: without the owner's key the release APK stays unsigned.
            signingConfig = hasReleaseSigning ? signingConfigs.release : null
        }
    }

    lint {
        // Using an API above minSdk 7 without a version check must stop the build.
        error += ['NewApi']
        abortOnError = true
        // PropertyEscape only fires on local.properties, which each PC writes and git never sees.
        // Keep it as a warning so it cannot stop the build on one machine.
        warning += ['PropertyEscape']
    }

    testOptions {
        unitTests.all {
            testLogging {
                events 'passed', 'failed'
                exceptionFormat = 'full'
            }
        }
    }
}

dependencies {
    // QR decoding. Pinned to 2.3.0: the code uses the 2.3.0 API, and 2.3.0 still runs on Java 6 / API 7.
    implementation 'com.google.zxing:core:2.3.0'

    testImplementation 'junit:junit:4.13.2'
}
