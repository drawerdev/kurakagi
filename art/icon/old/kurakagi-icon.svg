    <path id="keyhole" d="M45,48 A9,9 0 1,1 58.2,55.95 L60.4,69.6 Q60.8,72 58.4,72 L49.6,72 Q47.2,72 47.6,69.6 L49.8,55.95 A9,9 0 0,1 45,48 Z"
